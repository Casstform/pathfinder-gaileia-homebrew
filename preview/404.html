<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Gaileia Compendium</title>
    <script>
      (function () {
        var target = new URL("../", window.location.href);
        target.search = window.location.search;
        target.hash = window.location.hash;
        window.location.replace(target.href);
      })();
    </script>
  </head>
  <body>
    <p>The Gaileia Compendium has moved to <a id="production-link" href="../">the main site</a>.</p>
    <script>
      document.getElementById("production-link").href = "../" + window.location.search + window.location.hash;
    </script>
  </body>
</html>
